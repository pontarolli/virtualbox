# Telegraf - coleta metricas da VM e grava no InfluxDB do laboratorio.
#
# ATENCAO: este container roda com "network_mode: host" (fica na rede da
# propria VM, nao na rede lab-net). E por isso que:
#   - as metricas de rede sao das interfaces reais da VM (enp0s3, enp0s8);
#   - o endereco do InfluxDB aqui e "localhost:8086" (porta publicada pelo
#     compose), e nao "influxdb:8086" como nos outros containers.

[agent]
  interval = "10s"          # de quanto em quanto tempo coleta
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"    # de quanto em quanto tempo envia ao InfluxDB
  flush_jitter = "0s"
  precision = ""
  hostname = ""             # vazio = usa o hostname da VM
  omit_hostname = false

# ---------- SAIDA: para onde vao as metricas ----------
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "lab-influx-token-1234"
  organization = "lab"
  bucket = "lab"

# ---------- ENTRADAS: o que e coletado ----------

# CPU (measurement "cpu"): usage_user, usage_system, usage_idle, usage_active...
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

# Memoria (measurement "mem"): total, used, available, used_percent...
[[inputs.mem]]

# Disco (measurement "disk"): total, used, free, used_percent, por ponto de montagem
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Leitura e escrita em disco (measurement "diskio")
[[inputs.diskio]]

# Uptime e load average (measurement "system")
[[inputs.system]]

# Trafego por interface de rede (measurement "net")
[[inputs.net]]

# Numero de processos (measurement "processes")
[[inputs.processes]]

# Metricas de cada container (measurements "docker" e "docker_container_*")
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  docker_label_exclude = ["*"]
